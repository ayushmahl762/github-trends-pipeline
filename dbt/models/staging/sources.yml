version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: raw_github_repos
        description: Latest snapshot of each tracked repository (upserted daily).
        loaded_at_field: ingested_at
        freshness:
          warn_after: {count: 36, period: hour}
          error_after: {count: 72, period: hour}
      - name: raw_github_events
        description: Commit, star, issue and pull-request events (one row per event_id).
        loaded_at_field: ingested_at
        freshness:
          warn_after: {count: 36, period: hour}
          error_after: {count: 72, period: hour}
